name: create-release
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: 发布八个平台的独立程序
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for rid in win-x64 win-x86 win-arm64 linux-x64 linux-arm linux-arm64 osx-x64 osx-arm64; do
            name="ken-$rid"
            suffix=""
            if [[ "$rid" == win-* ]]; then suffix=".exe"; fi
            dotnet publish src/Cli/Cli.csproj -r "$rid" -c Release \
              -p:AssemblyName="$name" -p:DebugType=None -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesInSingleFile=true --self-contained true \
              --disable-build-servers -o "publish/$rid"
            cp "publish/$rid/$name$suffix" "release/$name$suffix"
          done

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/* --verify-tag --fail-on-no-commits --title "$RELEASE_TAG" --generate-notes


